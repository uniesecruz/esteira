jenkins:
  systemMessage: "Esteira ML Pipeline - Jenkins CI/CD"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  sonarGlobalConfiguration:
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "databricks-token"
              secret: "${DATABRICKS_TOKEN}"
              description: "Databricks API Token"
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN}"
              description: "SonarQube Authentication Token"

jobs:
  - script: >
      pipelineJob('esteira-ml-pipeline') {
        description('Car Price Prediction - PySpark ML Pipeline')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/uniesecruz/esteira.git')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
        triggers {
          scm('H/5 * * * *')
        }
      }
