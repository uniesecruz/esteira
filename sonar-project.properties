# SonarQube Configuration
sonar.projectKey=esteira-ml-pipeline
sonar.projectName=Esteira ML Pipeline - Car Price Prediction
sonar.projectVersion=1.0.0

# Source configuration
sonar.sources=src/
sonar.tests=tests/
sonar.language=py
sonar.sourceEncoding=UTF-8

# Python-specific
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions
sonar.exclusions=**/venv/**,**/__pycache__/**,**/data/**,**/docker/**
sonar.test.exclusions=**/venv/**,**/__pycache__/**

# Quality Gate
sonar.qualitygate.wait=true
